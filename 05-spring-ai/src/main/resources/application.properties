spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:h2:mem:budgeting
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.docker.compose.enabled=false

spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.base-url=https://api.groq.com/openai
spring.ai.openai.audio.transcription.api-key=${GROQ_API_KEY}
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro. Áudio contém descrição de gastos financeiros. As frases geralmente contêm um valor em reais, uma ação (gastei, paguei, comprei) e um local ou estabelecimento (mercado, farmácia, restaurante, loja).

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.base-url=https://api.groq.com/openai
spring.ai.openai.audio.speech.api-key=${GROQ_API_KEY}

logging.level.org.springframework.ai=DEBUG